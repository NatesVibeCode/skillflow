name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests
        run: python -m unittest discover -t . -s tests -v
      - name: Selector tests
        run: cd panel && python -m unittest test_select -v
      - name: Skill shape check
        run: python panel/check_skills.py
      - name: Shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning panel/run.sh
